C", "weight": 1}, {"source": "Areas/Writing/Complete Paper List — Martin Lepage Corpus", "target": "Martin Walks the Witches' Road — Corpus as Charge-Persistence", "weight": 1}, {"source": "Areas/Writing/Complete Paper List — Martin Lepage Corpus", "target": "Master Project Tracker — 2026", "weight": 1}, {"source": "Areas/Writing/Crossing Under Watch — Troll's Toll and Digital Ritual Passage", "target": "Areas/Writing/Queering Neo-Pagan Magic — 2026 Paper", "weight": 1}, {"source": "Areas/Writing/Crossing Under Watch — Troll's Toll and Digital Ritual Passage", "target": "Areas/Writing/Social Compass Paper — Ritual Authority and Régime de Preuve", "weight": 1}, {"source": "Areas/Writing/Crossing Under Watch — Troll's Toll and Digital Ritual Passage", "target": "Areas/Writing/Spider-Man and the Phonetic Glitch — Voice as Infrastructure", "weight": 1}, {"source": "Areas/Writing/Cultural and Lyric Corpus Memo — 2026-05-14", "target": "Areas/PHAROS/Trismégiste Eval v2 — Argus Closure and Redesign (2026-05-05)", "weight": 1}, {"source": "Areas/Writing/Cultural and Lyric Corpus Memo — 2026-05-14", "target": "Areas/Writing/Pagan and Queer Ritual Studies MOC", "weight": 1}]};</script>
  <script>
(async function () {
  const $ = (id) => document.getElementById(id);
  const err = $("err");
  const info = $("info");
  const neighborsEl = $("neighbors");
  const legendEl = $("legend");
  const statsEl = $("stats");
  const statusEl = $("status");

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  let data;
  try {
    data = window.__EMERAULD_GRAPH__;
    if (!data || !data.nodes) throw new Error("Graph data missing");
  } catch (e) {
    err.style.display = "block";
    err.textContent = e.message || String(e);
    return;
  }

  if (typeof vis === "undefined") {
    err.style.display = "block";
    err.textContent = "Graph library failed to load. Check network / CDN.";
    return;
  }

  const areaOn = {};
  Object.keys(data.areas || {}).forEach((a) => { areaOn[a] = true; });

  const nodeById = {};
  data.nodes.forEach((n) => { nodeById[n.id] = n; });

  // adjacency for neighbors panel
  const adj = {};
  data.edges.forEach((e) => {
    if (!adj[e.source]) adj[e.source] = [];
    if (!adj[e.target]) adj[e.target] = [];
    adj[e.source].push(e.target);
    adj[e.target].push(e.source);
  });

  function nodeVis(n) {
    return {
      id: n.id,
      label: n.label,
      title: n.title + (n.path ? "\n" + n.path : ""),
      size: n.size,
      color: {
        background: n.color,
        border: n.color,
        highlight: { background: "#ffffff", border: n.color },
        hover: { background: n.color, border: "#ffffff" },
      },
      font: { color: "#f0ece6", size: 11, face: "Inter, system-ui, sans-serif" },
      borderWidth: 1.5,
      area: n.area,
    };
  }

  const nodesDS = new vis.DataSet(data.nodes.map(nodeVis));
  const edgesDS = new vis.DataSet(
    data.edges.map((e, i) => ({
      id: "e" + i,
      from: e.source,
      to: e.target,
      width: Math.min(3, 0.4 + (e.weight || 1) * 0.15),
      color: { color: "rgba(196, 181, 253, 0.22)", highlight: "rgba(196, 181, 253, 0.7)" },
      smooth: { type: "continuous", roundness: 0.15 },
    }))
  );

  const network = new vis.Network(
    $("graph"),
    { nodes: nodesDS, edges: edgesDS },
    {
      autoResize: true,
      height: "100%",
      width: "100%",
      physics: {
        solver: "forceAtlas2Based",
        forceAtlas2Based: {
          gravitationalConstant: -42,
          centralGravity: 0.008,
          springLength: 110,
          springConstant: 0.05,
          damping: 0.48,
          avoidOverlap: 0.4,
        },
        stabilization: { iterations: 200, updateInterval: 25, fit: true },
      },
      interaction: {
        hover: true,
        tooltipDelay: 120,
        hideEdgesOnDrag: true,
        multiselect: false,
        zoomView: true,
        dragView: true,
      },
      nodes: {
        shape: "dot",
        scaling: { min: 8, max: 36 },
      },
      edges: {
        selectionWidth: 2,
      },
    }
  );

  function fillGraph() {
    const el = $("graph");
    if (!el) return;
    const w = el.clientWidth;
    const h = el.clientHeight;
    if (w > 0 && h > 0) {
      network.setSize(w + "px", h + "px");
      network.redraw();
    }
  }

  function fitAll() {
    fillGraph();
    network.fit({
      animation: false,
      padding: 28,
    });
  }

  statsEl.textContent =
    data.node_count + " notes · " + data.edge_count + " links (pruned vault graph)";

  // Size immediately, then again after layout
  fillGraph();
  requestAnimationFrame(() => {
    fillGraph();
    network.fit({ animation: false, padding: 36 });
  });

  network.once("stabilizationIterationsDone", () => {
    network.setOptions({ physics: { enabled: false } });
    fitAll();
    statusEl.textContent = "Full view — scroll to zoom · drag to pan";
  });

  window.addEventListener("resize", () => {
    fillGraph();
    network.fit({ animation: false, padding: 28 });
  });

  function showInfo(id) {
    const n = nodeById[id];
    if (!n) {
      info.innerHTML = '<span class="empty">Unknown node</span>';
      neighborsEl.innerHTML = "";
      return;
    }
    info.innerHTML =
      '<div class="title">' + esc(n.title) + "</div>" +
      '<div class="meta">' + esc(n.area) + " · " + esc(n.type) +
      " · degree " + esc(n.degree) +
      (n.backlinks ? " · " + esc(n.backlinks) + " backlinks" : "") +
      "</div>" +
      (n.path ? '<div class="meta">' + esc(n.path) + "</div>" : "");

    const neigh = (adj[id] || []).slice();
    // unique preserve order
    const seen = new Set();
    const uniq = [];
    for (const x of neigh) {
      if (seen.has(x)) continue;
      seen.add(x);
      uniq.push(x);
    }
    uniq.sort((a, b) => (nodeById[b]?.degree || 0) - (nodeById[a]?.degree || 0));

    let html = "<h2>Connected (" + uniq.length + ")</h2>";
    if (!uniq.length) {
      html += '<p class="empty" style="color:var(--faint);font-style:italic">No neighbors in this pruned view.</p>';
    } else {
      for (const nid of uniq.slice(0, 40)) {
        const nn = nodeById[nid];
        const label = nn ? nn.label : nid;
        const col = nn ? nn.color : "#78716c";
        html +=
          '<button type="button" class="n-item" data-id="' +
          esc(nid) +
          '" style="border-left-color:' +
          esc(col) +
          '">' +
          esc(label) +
          "</button>";
      }
    }
    neighborsEl.innerHTML = html;
    neighborsEl.querySelectorAll(".n-item").forEach((btn) => {
      btn.addEventListener("click", () => {
        const nid = btn.getAttribute("data-id");
        network.selectNodes([nid]);
        network.focus(nid, { scale: 1.15, animation: { duration: 400, easingFunction: "easeInOutQuad" } });
        showInfo(nid);
      });
    });
  }

  network.on("click", (params) => {
    if (params.nodes && params.nodes[0]) showInfo(params.nodes[0]);
  });

  // Legend filters
  const areas = data.areas || {};
  Object.keys(areas).forEach((area) => {
    const count = data.nodes.filter((n) => n.area === area).length;
    if (!count) return;
    const el = document.createElement("label");
    el.className = "leg";
    el.innerHTML =
      '<span class="dot" style="background:' +
      esc(areas[area]) +
      '"></span>' +
      esc(area) +
      " · " +
      count;
    el.addEventListener("click", () => {
      areaOn[area] = !areaOn[area];
      el.classList.toggle("dim", !areaOn[area]);
      applyAreaFilter();
    });
    legendEl.appendChild(el);
  });

  function applyAreaFilter() {
    const updates = data.nodes.map((n) => ({
      id: n.id,
      hidden: !areaOn[n.area],
    }));
    nodesDS.update(updates);
  }

  // Search
  const search = $("search");
  let searchTimer = null;
  search.addEventListener("input", () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      const q = search.value.trim().toLowerCase();
      if (!q) return;
      const hit = data.nodes.find(
        (n) =>
          n.title.toLowerCase().includes(q) ||
          n.label.toLowerCase().includes(q) ||
          (n.path && n.path.toLowerCase().includes(q))
      );
      if (hit && areaOn[hit.area] !== false) {
        network.selectNodes([hit.id]);
        network.focus(hit.id, {
          scale: 1.2,
          animation: { duration: 450, easingFunction: "easeInOutQuad" },
        });
        showInfo(hit.id);
      }
    }, 180);
  });
})();
  </script>
