<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EMERAULD — Knowledge graph</title>
  <meta name="description" content="PixiJS / WebGL wikilink graph of the EMERAULD vault.">
  <meta name="theme-color" content="#0b1020">
  <link rel="stylesheet" href="/css/emerauld-graph.css">
  <!-- PixiJS v7 UMD — WebGL renderer (Obsidian Graph View also uses PixiJS) -->
  <script src="https://cdn.jsdelivr.net/npm/pixi.js@7.4.2/dist/pixi.min.js"></script>
</head>
<body>
  <header>
    <div>
      <a class="back" href="/">← Board</a>
    </div>
    <div class="brand">
      <h1>EMERAULD</h1>
      <p>Vault constellation — PixiJS · WebGL · custom force</p>
    </div>
    <div class="tools">
      <input id="search" type="search" placeholder="Find a note…" autocomplete="off">
      <span class="stat" id="stats">…</span>
    </div>
  </header>
  <div class="layout">
    <div class="graph-wrap">
      <div id="graph"></div>
      <div id="status">Settling…</div>
      <div id="err"></div>
    </div>
    <aside>
      <div class="panel">
        <h2>Note</h2>
        <div id="info"><span class="empty">Click a node — neighbors appear below.</span></div>
      </div>
      <div id="neighbors"></div>
      <div id="legend"></div>
    </aside>
  </div>
  <script src="/js/emerauld-graph-data.js"></script>
  <script src="/js/emerauld-graph-app.js"></script>
</body>
</html>
