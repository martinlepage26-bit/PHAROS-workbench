<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EMERAULD — Knowledge graph</title>
  <meta name="description" content="Bright wikilink graph of the EMERAULD vault.">
  <meta name="theme-color" content="#fbfaf7">
  <link rel="stylesheet" href="/css/emerauld-graph.css">
  <script src="https://unpkg.com/vis-network@9.1.6/standalone/umd/vis-network.min.js"
    integrity="sha384-Ux6phic9PEHJ38YtrijhkzyJ8yQlH8i/+buBR8s3mAZOJrP1gwyvAcIYl3GWtpX1"
    crossorigin="anonymous"></script>
</head>
<body>
  <header>
    <div>
      <a class="back" href="/">← Board</a>
    </div>
    <div class="brand">
      <h1>EMERAULD</h1>
      <p>Vault constellation — bright map of linked notes</p>
    </div>
    <div class="tools">
      <input id="search" type="search" placeholder="Find a note…" autocomplete="off">
      <span class="stat" id="stats">…</span>
    </div>
  </header>
  <div class="layout">
    <div class="graph-wrap">
      <div id="graph"></div>
      <div id="status">Drag · scroll to zoom · click a node</div>
      <div id="err"></div>
    </div>
    <aside>
      <div class="panel">
        <h2>Note</h2>
        <div id="info"><span class="empty">Click a node — neighbors appear below.</span></div>
      </div>
      <div id="neighbors"></div>
      <div id="legend"></div>
    </aside>
  </div>
  <script src="/js/emerauld-graph-data.js"></script>
  <script src="/js/emerauld-graph-app.js"></script>
</body>
</html>
