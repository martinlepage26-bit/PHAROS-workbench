<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pharos Workbench</title>
  <meta name="description" content="Operational PHAROS workbench — D1-backed, HttpOnly session.">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="wrap">
  <div class="toolbar" role="toolbar" aria-label="Workbench controls">
    <button class="btn primary" type="button" data-action="item.add" data-section="">+ Item</button>
    <button class="btn" type="button" data-action="section.add">+ Section</button>
    <button class="btn" type="button" data-action="pipe.add">+ Pipeline stage</button>
    <span class="spacer"></span>
    <span class="saved" id="save-status">ready</span>
    <span class="saved" id="backend-status">backend: …</span>
    <button class="btn primary" type="button" data-action="sync">☁ Sync</button>
    <button class="btn" type="button" data-action="export">Export JSON</button>
    <button class="btn" type="button" data-action="import">Import JSON</button>
    <button class="btn" type="button" data-action="reset">Reset default</button>
    <input type="file" id="import-file" accept="application/json,.json" class="sr-only">
  </div>

  <div class="session-banner" id="session-banner">
    <span>Session required (HttpOnly cookie). Paste API key once:</span>
    <input class="field" id="session-key" type="password" placeholder="WORKBENCH_API_KEY" autocomplete="off">
    <button class="btn primary" type="button" data-action="session.login">Login</button>
  </div>

  <header>
    <div style="flex:1;min-width:240px">
      <input class="field title" id="meta-title" aria-label="Title">
      <input class="field sub" id="meta-subtitle" aria-label="Subtitle">
    </div>
    <div class="stamp">
      as of <input class="field mono inline" id="meta-asof" style="min-width:16ch;text-align:right" aria-label="As of">
      <br>window newest: <input class="field mono inline" id="meta-window" style="min-width:16ch;text-align:right" aria-label="Window newest">
      <br><span class="snap"><input class="field mono inline" id="meta-snap" style="min-width:18ch;text-align:center" aria-label="Snapshot label"></span>
    </div>
  </header>

  <nav class="nav" id="nav-links" aria-label="Workbench links"></nav>
  <div class="grid" id="board"></div>
  <footer id="footer-note"></footer>
</div>

<!-- Item modal -->
<div class="modal-bg" id="modal-item" role="dialog" aria-modal="true">
  <div class="modal">
    <h3 id="modal-item-title">Edit item</h3>
    <label for="m-section">Section</label>
    <select class="field" id="m-section"></select>
    <label for="m-time">Time / date</label>
    <input class="field" id="m-time" placeholder="18:26 or Aug 6">
    <label for="m-source">Source / bold lead</label>
    <input class="field" id="m-source" placeholder="OpenAI">
    <label for="m-text">Text</label>
    <textarea class="field" id="m-text" rows="3" placeholder="What needs attention"></textarea>
    <label for="m-tag">Tag / chip</label>
    <input class="field" id="m-tag" placeholder="ACTION REQUIRED">
    <label for="m-tag-kind">Tag style</label>
    <select class="field" id="m-tag-kind">
      <option value="">default</option>
      <option value="c-money">money / alert</option>
      <option value="c-decision">decision</option>
      <option value="c-ok">ok / done</option>
    </select>
    <label for="m-kind">Kind tag (files)</label>
    <select class="field" id="m-kind">
      <option value="">none</option>
      <option value="DOC">DOC</option>
      <option value="MD">MD</option>
      <option value="HTML">HTML</option>
      <option value="JSON">JSON</option>
      <option value="ZIP">ZIP</option>
      <option value="LINK">LINK</option>
    </select>
    <label for="m-url">Link URL (optional)</label>
    <input class="field" id="m-url" placeholder="https://...">
    <div class="actions">
      <button class="btn danger" type="button" data-action="item.modal-delete" style="margin-right:auto" id="m-delete">Delete</button>
      <button class="btn ghost" type="button" data-action="modal.close">Cancel</button>
      <button class="btn primary" type="button" data-action="item.save">Save</button>
    </div>
  </div>
</div>

<!-- Section modal -->
<div class="modal-bg" id="modal-section" role="dialog" aria-modal="true">
  <div class="modal">
    <h3 id="modal-section-title">Section</h3>
    <label for="s-title">Title</label>
    <input class="field" id="s-title" placeholder="Needs action">
    <label for="s-layout">Layout</label>
    <select class="field" id="s-layout">
      <option value="half">Half width</option>
      <option value="full">Full width</option>
    </select>
    <label for="s-style">Style</label>
    <select class="field" id="s-style">
      <option value="normal">Normal</option>
      <option value="alert">Alert</option>
    </select>
    <label for="s-empty">Empty message</label>
    <input class="field" id="s-empty" placeholder="Nothing here yet">
    <label for="s-link-label">Footer link label</label>
    <input class="field" id="s-link-label" placeholder="↗ open source">
    <label for="s-link-url">Footer link URL</label>
    <input class="field" id="s-link-url" placeholder="https://...">
    <div class="actions">
      <button class="btn danger" type="button" data-action="section.modal-delete" style="margin-right:auto" id="s-delete">Delete section</button>
      <button class="btn ghost" type="button" data-action="modal.close">Cancel</button>
      <button class="btn primary" type="button" data-action="section.save">Save</button>
    </div>
  </div>
</div>

<!-- Pipeline modal -->
<div class="modal-bg" id="modal-pipe" role="dialog" aria-modal="true">
  <div class="modal">
    <h3>Pipeline stage</h3>
    <label for="p-code">Code</label>
    <input class="field" id="p-code" placeholder="00">
    <label for="p-label">Label</label>
    <input class="field" id="p-label" placeholder="Project Control">
    <label for="p-url">URL</label>
    <input class="field" id="p-url" placeholder="https://drive.google.com/...">
    <div class="actions">
      <button class="btn danger" type="button" data-action="pipe.modal-delete" style="margin-right:auto" id="p-delete">Delete</button>
      <button class="btn ghost" type="button" data-action="modal.close">Cancel</button>
      <button class="btn primary" type="button" data-action="pipe.save">Save</button>
    </div>
  </div>
</div>

<!-- Link modal -->
<div class="modal-bg" id="modal-link" role="dialog" aria-modal="true">
  <div class="modal">
    <h3>Nav link</h3>
    <label for="l-label">Label</label>
    <input class="field" id="l-label" placeholder="Register">
    <label for="l-url">URL</label>
    <input class="field" id="l-url" placeholder="files/paper-register.html">
    <div class="actions">
      <button class="btn danger" type="button" data-action="link.modal-delete" style="margin-right:auto" id="l-delete">Delete</button>
      <button class="btn ghost" type="button" data-action="modal.close">Cancel</button>
      <button class="btn primary" type="button" data-action="link.save">Save</button>
    </div>
  </div>
</div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
